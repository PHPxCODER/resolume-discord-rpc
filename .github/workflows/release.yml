name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: |
              apps/desktop/dist/*.exe
              apps/desktop/dist/*.blockmap
              apps/desktop/dist/latest.yml
          - os: macos-latest
            artifact: |
              apps/desktop/dist/*.dmg
              apps/desktop/dist/*.zip
              apps/desktop/dist/*.blockmap
              apps/desktop/dist/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm generate-icons
      # electron-builder signs automatically when CSC_LINK is set and
      # skips signing when it isn't; notarization is only requested when
      # Apple credentials exist. With no secrets configured this step
      # builds unsigned artifacts exactly like before.
      # The app version comes from the tag (v1.2.3 → 1.2.3) so releases
      # never need a version-bump commit; extraMetadata.main is repeated
      # here so the CLI override can't clobber the packaged entrypoint.
      - name: Build (signs/notarizes when certificate secrets exist)
        shell: bash
        run: |
          # Unconfigured secrets arrive as empty strings, and electron-builder
          # treats an empty CSC_LINK as a certificate path (resolving to the
          # project dir → "not a file"). Drop empties so no-secrets builds
          # are genuinely unsigned.
          [ -n "$CSC_LINK" ] || unset CSC_LINK CSC_KEY_PASSWORD
          [ -n "$APPLE_ID" ] || unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          VERSION="${GITHUB_REF_NAME#v}"
          ARGS="--config.extraMetadata.version=$VERSION --config.extraMetadata.main=bundle/main.js"
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_ID" ]; then
            ARGS="$ARGS --config.mac.notarize=true"
          fi
          # pnpm's script-arg forwarding inserts a stray "--" that breaks
          # electron-builder's flag parsing, so invoke the binary directly.
          pnpm --filter @resolume-discord-rpc/desktop build:ts
          pnpm --filter @resolume-discord-rpc/desktop bundle
          pnpm --filter @resolume-discord-rpc/desktop exec electron-builder --publish never $ARGS
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
